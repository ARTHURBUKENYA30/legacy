<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset password | Green Shoots Legacy Sports Squash Academy</title>
<style>
:root{color-scheme:light;--green:#123d2b;--green2:#21764b;--ink:#183528;--muted:#65776b;--line:#dce7de;--paper:#f4f7f3;--red:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,520px);background:white;border:1px solid #e1eae2;border-radius:18px;padding:clamp(22px,5vw,36px);box-shadow:0 16px 44px #123d2b12}h1{margin:0 0 10px;color:var(--green);font-size:clamp(1.7rem,5vw,2.2rem);line-height:1.2}p{color:var(--muted)}label{display:block;font-weight:700;margin:16px 0 6px}input,button{font:inherit;width:100%;padding:12px 14px;border-radius:10px}input{border:1px solid #cbd9ce}input:focus{outline:3px solid #21764b30;border-color:var(--green2)}button{margin-top:18px;border:0;background:var(--green2);color:white;font-weight:750;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--red)}.success{color:#176c3a}.back{display:inline-block;margin-top:12px;color:var(--green2);font-weight:700;text-decoration:none}
</style>
</head>
<body><main class="card">
<h1>Set a new password</h1>
<p>Use this page after opening the latest password-reset email from Green Shoots. Your existing administrator account will be kept.</p>
<form id="resetForm" hidden>
<label for="newPassword">New password</label>
<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
<button id="saveButton" type="submit">Update password</button>
</form>
<p id="status" class="status" role="status">Checking your reset link…</p>
<a class="back" href="admin.html">Return to admin sign in</a>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://sbfyvcsechxnsxlvzuvv.supabase.co','sb_publishable_itwkgKU9h9fd8qMn7w9qjg_2DY2uezD');
const form=document.getElementById('resetForm'), message=document.getElementById('status'), save=document.getElementById('saveButton');
function show(text,kind=''){message.textContent=text;message.className='status '+kind}
let validRecovery=false;
try{
  const url=new URL(location.href);
  const hash=new URLSearchParams(url.hash.slice(1));
  const queryType=url.searchParams.get('type');
  const hashType=hash.get('type');
  if(url.searchParams.has('error')||hash.has('error')){
    throw new Error(url.searchParams.get('error_description')||hash.get('error_description')||'This reset link is invalid or expired. Request a new one from the admin sign-in page.');
  }
  const {data,error}=await supabase.auth.getSession();
  if(error)throw error;
  const session=data.session;
  validRecovery=!!session && (queryType==='recovery'||hashType==='recovery'||!!session);
  if(!validRecovery)throw new Error('This reset link is missing or expired. Return to admin sign in, enter your email, and click “Forgot your password?” to request a fresh link.');
  form.hidden=false;
  show('Reset link verified. Enter your new password below.');
}catch(err){show(err.message||'Could not verify this reset link. Request a new one from admin sign in.','error')}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!validRecovery){show('Request a new reset link from admin sign in.','error');return}
  const password=document.getElementById('newPassword').value;
  const confirm=document.getElementById('confirmPassword').value;
  if(password.length<8){show('Use at least 8 characters for your password.','error');return}
  if(password!==confirm){show('The two passwords do not match.','error');return}
  save.disabled=true;show('Updating password…');
  try{
    const {error}=await supabase.auth.updateUser({password});
    if(error)throw error;
    await supabase.auth.signOut();
    form.hidden=true;
    show('Password updated successfully. Go to admin sign in and log in with your new password.','success');
  }catch(err){show(err.message||'Password update failed. Request a new reset link and try again.','error')}
  finally{save.disabled=false}
});
</script></body></html>
